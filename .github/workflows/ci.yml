name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-optional.txt -r requirements-dev.txt

      - name: Run tests
        env:
          ENABLE_ML_CLASSIFIER: "false"
          ENABLE_VOICE: "false"
        run: python -m pytest -q

      - name: Run lint
        run: python -m ruff check app ml tests
